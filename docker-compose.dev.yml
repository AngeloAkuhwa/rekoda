# Local development: `docker compose -f docker-compose.dev.yml up -d`
# Postgres only — apps run on the host via pnpm for fast iteration.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rekoda
      POSTGRES_DB: rekoda
      # No password, and this is not a downgrade: a password committed to the
      # repository protects nothing, since anything that can reach the port can
      # also read the password. The container is bound to 127.0.0.1 only (see
      # ports below), so trust auth is the same exposure with no credential
      # literal for a scanner to flag or a reader to mistake for a real one.
      # Production credentials come from the environment, never a file.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rekoda']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
