# Rekoda on one host: Caddy in front of web and api, a worker, PostgreSQL
# (ADR 0006; G-01). Operated by docs/runbooks/deploy.md, always as
#
#   docker compose -f docker-compose.prod.yml <command>
#
# from the checkout, where `.env` (filled from .env.example) supplies every
# ${NAME} below and the api, worker and migrate environments, and `secrets/` holds the
# PostgreSQL owner password. Neither is ever committed.
#
# The rules this file keeps, each checked in CI by scripts/check-deploy.mjs:
#   - only caddy publishes a port; PostgreSQL is reachable from nothing but
#     the api, the worker, the operator and settlement processes and the
#     migrate job, on a network with no egress;
#   - the owner (migration) credential is mounted into postgres and the
#     migrate job only. The api and worker hold the rekoda_app and
#     rekoda_worker URLs from .env and can never start as the owner (their
#     boot doctor refuses a role that can bypass RLS as well);
#   - the billing-operator credential reaches the operator service only and
#     the settlement credential reaches the settlement service only (OD-51).
#     Those two services are given a named list of variables, never the
#     shared .env; the api and the worker have both URLs blanked, and each
#     of the four refuses to start holding a credential that is not its own;
#   - the api and the worker run the SAME image; the worker is the one with
#     REKODA_WORKER=1;
#   - web receives exactly the runtime names its code reads, and no secret;
#     its public NEXT_PUBLIC_* values are baked in at build;
#   - no test hook appears anywhere in this file.

# The project name is fixed, so the volumes are always rekoda-prod_pgdata and
# rekoda-prod_caddy_data: a checkout in another directory must find the same
# database, not open an empty one that looks like data loss. Not `rekoda`,
# which is docker-compose.dev.yml's default project name in a checkout called
# rekoda, so the two can never share a volume.
name: rekoda-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker's 64 MB default /dev/shm is exhausted by parallel queries.
    shm_size: 256mb
    environment:
      POSTGRES_USER: rekoda_owner
      POSTGRES_DB: rekoda
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      # Over TCP, not the socket: on first boot the image's init server
      # answers on the socket before PostgreSQL listens on the network.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U rekoda_owner -d rekoda']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # One-off, never started by `up`: `docker compose ... run --rm migrate`.
  # Applies migrations as the owner, then sets the runtime roles' passwords
  # from the two URLs in .env (deploy/migrate.sh).
  migrate:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    # Built by the api service's build, on this host; never pulled from a
    # registry, so a missing image is an error rather than a stranger's image.
    pull_policy: never
    profiles:
      - ops
    command: ['sh', '/repo/deploy/migrate.sh']
    # The runtime URLs come from .env itself, the file the api and worker
    # load, never from compose interpolation, where an exported shell value
    # would win and the roles would get passwords the services never see.
    # It receives the whole file, like the api it shares an image with; the
    # owner password is the one thing it holds that they do not.
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_OWNER: rekoda_owner
      POSTGRES_HOST: postgres
      POSTGRES_DB: rekoda
    secrets:
      - postgres_owner_password
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    # Built here, never pulled: a missing release image is built from the
    # checkout or fails, never fetched under the same name from a registry.
    pull_policy: never
    build:
      context: .
      target: app
      args:
        REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    restart: unless-stopped
    # Requests in flight (a webhook, a report render) finish before the stop.
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      REKODA_WORKER: '0'
      # OD-51: the API holds neither privileged credential the shared .env carries for the
      # operator and settlement services and the migrate job. It opens charges as rekoda_app and
      # serves no plan route (Caddy sends those to the operator service); a production API given
      # either URL refuses to start.
      SETTLEMENT_DATABASE_URL: ''
      OPERATOR_DATABASE_URL: ''
      # The same value that tags the image, so /health names what is running
      # even when the shell exports a different one than .env.
      REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
      # Caddy's fixed address on the edge network: the only proxy the API
      # believes an X-Forwarded-For from.
      REKODA_TRUSTED_PROXIES: 172.30.10.10
      # The web tier's fixed address: the only peer whose X-Rekoda-Client-IP
      # names the visitor a call is for (G-71).
      REKODA_TRUSTED_WEB: 172.30.10.11
    networks:
      - edge
      - db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => r.json()).then((b) => process.exit(b.status === 'ok' ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  worker:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    # Built by the api service's build, on this host; never pulled from a
    # registry, so a missing image is an error rather than a stranger's image.
    pull_policy: never
    restart: unless-stopped
    # A stop lets in-flight jobs finish: one job can chain a media fetch, a
    # 60 s transcription, two 20 s model calls and a send. Killed mid-job, it
    # would sit 'running' until the five-minute reclaim and could repeat its
    # message or document.
    stop_grace_period: 150s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      REKODA_WORKER: '1'
      REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
      # OD-51 (migration 0217): the worker holds neither privileged credential. It serves no
      # operator route and it no longer settles Rekoda charges: the settlement service does, and
      # the database refuses the worker those jobs. A production worker given either URL refuses
      # to start.
      OPERATOR_DATABASE_URL: ''
      SETTLEMENT_DATABASE_URL: ''
      REKODA_TRUSTED_PROXIES: 172.30.10.10
      REKODA_TRUSTED_WEB: 172.30.10.11
    networks:
      - db
      - worker-egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => r.json()).then((b) => process.exit(b.status === 'ok' ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # The operator plane (OD-51.1): the only process holding the billing-operator credential, and
  # so the only one that can change a business's plan. It verifies the operator's token itself,
  # against its own audience, and shares no secret with the API. Its environment is the named
  # list below and nothing else: it never receives the shared .env.
  operator:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    pull_policy: never
    command: ['node', 'dist/operator-main.js']
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: '3002'
      REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
      OPERATOR_DATABASE_URL: ${OPERATOR_DATABASE_URL:?set OPERATOR_DATABASE_URL in .env}
      OPERATOR_OIDC_ISSUER: ${OPERATOR_OIDC_ISSUER:?set OPERATOR_OIDC_ISSUER in .env}
      OPERATOR_OIDC_JWKS_URL: ${OPERATOR_OIDC_JWKS_URL:?set OPERATOR_OIDC_JWKS_URL in .env}
      OPERATOR_BILLING_OIDC_AUDIENCE: ${OPERATOR_BILLING_OIDC_AUDIENCE:?set OPERATOR_BILLING_OIDC_AUDIENCE in .env}
      # Only so the process can refuse an audience equal to the API's; it accepts no such token.
      OPERATOR_OIDC_AUDIENCE: ${OPERATOR_OIDC_AUDIENCE:-}
      OPERATOR_OIDC_SCOPE_CLAIM: ${OPERATOR_OIDC_SCOPE_CLAIM:-}
    networks:
      # edge: Caddy reaches it, and it reaches the identity provider's key set.
      - edge
      - db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then((r) => r.json()).then((b) => process.exit(b.status === 'ok' && b.process === 'operator' ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Settlement (OD-51.2): the only process holding the settlement credential, and so the only one
  # that can record a Rekoda payment, apply a paid plan or credit a pack. It runs two job kinds,
  # verifies every payment with Paystack itself and serves nothing but a loopback health check.
  # Its environment is the named list below and nothing else: it never receives the shared .env.
  settlement:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    pull_policy: never
    command: ['node', 'dist/settlement-main.js']
    restart: unless-stopped
    # A settlement in flight (one provider verify, one transaction) finishes before the stop.
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      PORT: '3003'
      REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
      SETTLEMENT_DATABASE_URL: ${SETTLEMENT_DATABASE_URL:?set SETTLEMENT_DATABASE_URL in .env}
      # Opens the stored webhook event a settlement job names; verifies the payment it reports.
      VAULT_KEY: ${VAULT_KEY:?set VAULT_KEY in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      REKODA_PLAN_CATALOGUE_READS: ${REKODA_PLAN_CATALOGUE_READS:-}
      REKODA_SETTLEMENT_CONCURRENCY: ${REKODA_SETTLEMENT_CONCURRENCY:-}
    networks:
      - db
      - settlement-egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then((r) => r.json()).then((b) => process.exit(b.status === 'ok' && b.process === 'settlement' ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    image: rekoda-web:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    pull_policy: never
    build:
      context: .
      target: web
      args:
        REKODA_RELEASE: ${REKODA_RELEASE:?set REKODA_RELEASE in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_REKODA_WHATSAPP: ${NEXT_PUBLIC_REKODA_WHATSAPP:-}
        NEXT_PUBLIC_LEGAL_ENTITY: ${NEXT_PUBLIC_LEGAL_ENTITY:-}
        NEXT_PUBLIC_LEGAL_RC_NUMBER: ${NEXT_PUBLIC_LEGAL_RC_NUMBER:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_NDPR_AUDITOR: ${NEXT_PUBLIC_NDPR_AUDITOR:-}
        NEXT_PUBLIC_MONO_PUBLIC_KEY: ${NEXT_PUBLIC_MONO_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Web talks to the API over the internal network, never through the
      # public hostname.
      REKODA_API_URL: http://api:3001
      REKODA_WEB_URL: ${REKODA_WEB_URL:?set REKODA_WEB_URL in .env}
    networks:
      edge:
        # Fixed, so the API can believe this address, and only this one,
        # about which visitor a call is for (REKODA_TRUSTED_WEB, G-71).
        ipv4_address: 172.30.10.11
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/terms').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Caddy reads REKODA_EDGE_PROXIES itself, so no Rekoda process ever sees it
  # and the boot rules that refuse an unsafe trust list in the api and the
  # worker (G-72) cannot reach it. This one-shot job checks it in the app
  # image, and Caddy waits for it: a universal value (0.0.0.0/0, ::/0) fails
  # the deployment instead of letting Caddy believe a browser's
  # CF-Connecting-IP and hand that address on as the visitor (G-74). So does
  # private_ranges, or any range holding the edge network's gateway (G-75).
  edge-check:
    image: rekoda-app:${REKODA_RELEASE:?set REKODA_RELEASE in .env}
    pull_policy: never
    command: ['node', 'dist/edge-check.js']
    environment:
      # Exactly what compose gives Caddy below, checked before Caddy runs.
      REKODA_EDGE_PROXIES: ${REKODA_EDGE_PROXIES:-}
    # It reads one environment variable; it needs no network and no database.
    network_mode: none
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
      REKODA_API_PUBLIC_URL: ${REKODA_API_PUBLIC_URL:?set REKODA_API_PUBLIC_URL in .env}
      REKODA_ACME_EMAIL: ${REKODA_ACME_EMAIL:?set REKODA_ACME_EMAIL in .env}
      REKODA_EDGE_PROXIES: ${REKODA_EDGE_PROXIES:-}
    volumes:
      # The directory, not the file: `git checkout` replaces the Caddyfile with
      # a new file, and a single-file bind mount would keep showing the old
      # one, so a reload after a deploy would re-read stale configuration.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy writes only to its two volumes.
    read_only: true
    tmpfs:
      - /tmp
    networks:
      edge:
        ipv4_address: 172.30.10.10
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      operator:
        condition: service_healthy
      # Never serve with an edge trust list a browser could exploit (G-74).
      edge-check:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # Caddy, web and api. Fixed so REKODA_TRUSTED_PROXIES can name Caddy
  # (.10) and REKODA_TRUSTED_WEB can name web (.11) exactly; change them
  # together if the range collides with the host's.
  edge:
    # IPv4 only, with the gateway pinned: Docker hands Caddy every IPv6
    # visitor and every hairpin connection from that one address, and the
    # edge check refuses any REKODA_EDGE_PROXIES range holding it (G-75,
    # EDGE_GATEWAY in apps/api/src/edge-proxies.ts). Change them together.
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
          # Dynamic addresses come from the upper half only, so a recreated
          # container can never take Caddy's fixed .10 or web's fixed .11.
          ip_range: 172.30.10.128/25
  # PostgreSQL and the processes that may reach it (api, worker, operator,
  # settlement, migrate). No egress at all.
  db:
    internal: true
  # Settlement's route out to Paystack, shared with nothing else.
  settlement-egress: {}
  # The worker's route out (Meta, the model providers, Paystack), without
  # joining the network web and Caddy share.
  worker-egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  postgres_owner_password:
    file: ./secrets/postgres_owner_password
