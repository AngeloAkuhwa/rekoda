name: Deploy staging

# Staging follows main, one exact commit at a time, and only a commit CI
# passed. The host does the work (scripts/deploy-staging.sh, the runbook's
# "Deploy a release" sequence); this workflow only chooses the commit and
# hands the host that commit's copy of the script over SSH. Secrets stay on
# the host in .env and secrets/: the only ones here are the SSH key, the host
# key, the host and the user, all from the "staging" environment.
#
# Production is not deployed from here, or from anywhere automatic.
# CI keeps this file in step with the runbook: scripts/check-staging-deploy.mjs.

on:
  # After CI finishes on main. The job below also insists the run succeeded
  # and was a push to this repository's main: `branches` matches a head
  # branch NAME, which a pull request from a fork can share.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual runs for testing, or to redeploy an earlier commit of main. The
  # commit must be on main and must have a successful CI push run.
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA of a commit on main that CI passed (blank means the tip of the chosen branch)
        required: false
        default: ''

permissions:
  contents: read
  # To confirm CI passed for a manually requested commit.
  actions: read

# One deployment at a time, and never cancelled halfway: a newer request
# waits for the running one to finish rather than killing a migration.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.myrekoda.com
    steps:
      # Every expression reaches the shell through env, never pasted into a
      # script, so no event field can become a command.
      - name: Choose the commit
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            sha=$RUN_SHA
          else
            sha=${INPUT_SHA:-$REF_SHA}
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "not a full 40-character commit SHA: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "deploying $sha"

      # A workflow_run already carries a successful CI push run on main. A
      # manual run proves the same for the commit it names.
      - name: CI passed on main for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --commit "$SHA" --status success \
            --limit 1 --json databaseId --jq length)
          if [ "$passed" != 1 ]; then
            echo "no successful CI run on a push to main for $SHA" >&2
            exit 1
          fi

      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: The checkout is the commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"

      # The host key is pinned from the environment. Nothing here learns a
      # key from the network or accepts one it has not seen.
      - name: SSH key and pinned host key
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_SSH_PRIVATE_KEY" ] || [ -z "$STAGING_KNOWN_HOSTS" ]; then
            echo "STAGING_SSH_PRIVATE_KEY and STAGING_KNOWN_HOSTS must be set in the staging environment" >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/id")
          (umask 077 && printf '%s\n' "$STAGING_KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts")

      - name: Deploy on the host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ]; then
            echo "STAGING_HOST and STAGING_USER must be set in the staging environment" >&2
            exit 1
          fi
          # This commit's copy of the script, run by bash on the host. The SHA
          # is 40 hex characters (checked above), so it is safe on the remote
          # command line.
          ssh -i "$RUNNER_TEMP/ssh/id" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$STAGING_USER@$STAGING_HOST" \
            "bash -s -- $SHA" <scripts/deploy-staging.sh

      # The same answer, asked from outside the host through Cloudflare.
      - name: Staging answers with this commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://staging-api.myrekoda.com/health | tee "$RUNNER_TEMP/health.json"
          echo
          # The host abbreviates the SHA (at least 7 characters, longer only
          # if its clone needs it), so match the prefix rather than recompute.
          jq -e --arg sha "$SHA" \
            '.commit as $c | .status == "ok" and .database == "up" and ($c | length >= 7)
             and ($sha | startswith($c)) and .release == "staging-\($c)"' \
            "$RUNNER_TEMP/health.json" >/dev/null

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
