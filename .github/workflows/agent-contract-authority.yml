# Contract authority — the only workflow that can SIGN contract
# baseline/revision markers (docs/AUTONOMOUS-ENGINEERING.md §6).
# Deterministic, no AI. Its environment (agents-contract-authority)
# holds CONTRACT_AUTHORITY_SIGNING_KEY — a key the builder, planner and
# reviewers do not possess, which is what separates contract authority
# from everyone who merely wants the contract changed. The owner's human
# account is the other authorized source (unsigned; the platform proves
# a human authored it).
#
#   - When an agent-task issue is labelled status:ready by a write+
#     actor, it posts the signed REKODA_CONTRACT_BASELINE (revision 1)
#     if no baseline exists yet — recording, not amending.
#   - Amendments are workflow_dispatch only (write+ access required by
#     GitHub to dispatch): a signed REKODA_CONTRACT_REVISION with the
#     new hash and reason. The evaluator enforces monotonic history and
#     rejects conflicts, so a second conflicting baseline or a replayed
#     revision blocks the PR rather than changing anything.
name: Agent — contract authority

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to amend
        required: true
        type: number
      revision:
        description: New revision number (previous + 1)
        required: true
        type: number
      reason:
        description: Why the contract changed
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: contract-authority-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  contract:
    name: Contract authority
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'status:ready' &&
       contains(github.event.issue.labels.*.name, 'agent-task'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agents-contract-authority
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Resolve the immutable trusted-governance SHA
        id: trusted
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/heads/main" --jq .sha)
          echo "Trusted governance SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          fetch-depth: 1

      - name: Authorize actor
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "Actor $ACTOR permission: $perm" ;;
            *) echo "::error::Actor $ACTOR (permission: $perm) may not drive contract authority."; exit 1 ;;
          esac

      - name: Post the signed marker
        env:
          CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
          # env-var indirection — dispatch inputs never touch shell syntax
          REVISION_INPUT: ${{ inputs.revision }}
          REASON_INPUT: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/contract-revision.mjs ]; then
            echo "::error::Policy scripts are not on main yet."; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
              --revision "$REVISION_INPUT" --reason "$REASON_INPUT" \
              --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post
          else
            # Baseline: record once; never overwrite an existing baseline.
            if gh api "repos/$REPO/issues/$ISSUE/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("REKODA_CONTRACT_BASELINE"))] | length' | grep -qv '^0$'; then
              echo "A baseline marker already exists on #$ISSUE — not posting another."
              exit 0
            fi
            node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
              --baseline --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post
          fi
