# Contract authority — the only workflow that can SIGN contract
# baseline/revision/amendment-freeze markers
# (docs/AUTONOMOUS-ENGINEERING.md §6). Deterministic, no AI. Its
# environment (agents-contract-authority) holds
# CONTRACT_AUTHORITY_SIGNING_KEY — a key the builder, planner and
# reviewers do not possess, which is what separates contract authority
# from everyone who merely wants the contract changed. The owner's human
# account is the other authorized baseline source (unsigned; the
# platform proves a human authored it).
#
# BASELINE (mode=baseline dispatch, or a human label event): when an
# agent-task issue carries status:ready plus exactly one risk and one
# builder label (labels RE-FETCHED at decision time, so any labelling
# order works), it records the signed REKODA_CONTRACT_BASELINE — with
# RISK and BUILDER inside the signed snapshot — if no VALID baseline
# exists yet, then dispatches the Claude builder when builder:claude.
# Existence is decided by the SAME canonical computation admission uses
# (contract-status.mjs → computeContractRevision): text that merely
# contains a marker name, a malformed/unsigned/wrong-issue marker, or a
# bad signature never suppresses the real baseline; conflicting
# AUTHORIZED history fails closed instead of being papered over. The
# planner EXPLICITLY dispatches this entry point (GITHUB_TOKEN label
# events never trigger workflows — GitHub's recursion suppression), so
# autonomous promotion does not depend on event recursion.
#
# AMENDMENT (mode=revision dispatch, owner-only) — the atomic
# freeze-before-mutate transaction, with the freeze itself part of the
# EVALUATOR's merge contract, not merely red check writes:
#   1. plan: authorize the owner, compute current revision, find every
#      linked open PR (exhaustive; unprovable → abort);
#   2. freeze_marker: post the SIGNED REKODA_CONTRACT_AMENDMENT_FREEZE
#      (from → target revision). From this durable moment the evaluator
#      returns CONTRACT_AMENDMENT_IN_PROGRESS for every linked PR: NO
#      finalizer, whenever scheduled, can conclude an old-revision green
#      after reading state that contains the freeze;
#   3. barrier (matrix, one job per linked PR, inside that PR's
#      rekoda-gates-pr-<pr> group): forces the three required checks red.
#      After a PR's barrier completes, every later check writer entered
#      the group AFTER the freeze marker existed — its state read
#      contains the freeze (before signing) or the new revision (after),
#      and either way old-revision green is impossible. A finalizer that
#      entered the group BEFORE the barrier had its writes overwritten
#      red by the barrier itself. At the moment the revision is signed,
#      every linked PR is therefore non-merge-authorizing and cannot be
#      re-greened under the old revision;
#   4. sign: post the SIGNED revision marker (recording the current
#      risk/builder labels in the snapshot). Its existence is exactly
#      what EXPIRES the freeze — the freeze and the new revision hand
#      over atomically inside evaluator state, with no interval in
#      which the old revision can authorize anything;
#   5. dispatch: re-run the gates per linked PR (JSON parsed with a real
#      parser — [70,73] dispatches 70 and 73, never 7073). A failed
#      dispatch leaves the PR blocked (frozen or wrong-revision), never
#      silently green.
# Any partial failure leaves the freeze active and every linked PR
# evaluator-blocked; recovery is the owner re-running the amendment.
name: Agent — contract authority

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: baseline (record baseline + hand off) or revision (owner-only amendment)
        required: false
        default: revision
        type: choice
        options: [revision, baseline]
      issue:
        description: Issue number
        required: true
        type: number
      revision:
        description: 'mode=revision: new revision number (previous + 1)'
        required: false
        type: number
      reason:
        description: 'mode=revision: why the contract changed'
        required: false
        type: string

permissions: {}

# Amendments/baselines for ONE issue serialize; different issues never
# contend. cancel-in-progress: false — a transaction in flight is never
# cancelled midway.
concurrency:
  group: contract-authority-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  # ---------------------------------------------------------------- #
  # Amendment transaction (workflow_dispatch mode=revision, owner-only)#
  # ---------------------------------------------------------------- #
  plan:
    name: Authorize and find linked PRs
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      prs: ${{ steps.linked.outputs.prs }}
      has_prs: ${{ steps.linked.outputs.has_prs }}
      from_revision: ${{ steps.current.outputs.revision }}
      trusted_sha: ${{ github.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
      REVISION_INPUT: ${{ inputs.revision }}
      REASON_INPUT: ${{ inputs.reason }}
    steps:
      # workflow_dispatch executes the default-branch definition;
      # github.sha IS that trusted commit — definition and policy share
      # one immutable trust root.
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authorize actor (amendments are owner-only)
        env:
          OWNER_LOGIN: AngeloAkuhwa
        run: |
          set -euo pipefail
          # Contract AMENDMENTS after implementation begins are
          # OWNER-ONLY (docs/AUTONOMOUS-ENGINEERING.md §6): no write
          # collaborator may sign new requirements.
          if [ "$ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::Contract amendments are owner-only; actor $ACTOR is not @$OWNER_LOGIN."
            exit 1
          fi

      - name: Verify the target revision continues the current history
        id: current
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/contract-status.mjs ]; then
            echo "::error::Policy scripts are not on main yet."; exit 1
          fi
          node scripts/agents/contract-status.mjs --repo "$REPO" --issue "$ISSUE"
          current=$(grep '^revision=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ -z "$current" ]; then
            echo "::error::Issue #$ISSUE has no valid current revision; amend only a valid contract."
            exit 1
          fi
          if [ "$REVISION_INPUT" != "$((current + 1))" ]; then
            echo "::error::Requested revision $REVISION_INPUT does not continue the current revision $current (expected $((current + 1)))."
            exit 1
          fi
          if [ -z "${REASON_INPUT:-}" ]; then
            echo "::error::mode=revision requires a non-empty reason."
            exit 1
          fi

      - name: Find every linked open PR (exhaustive; unprovable → abort)
        id: linked
        run: |
          set -euo pipefail
          node scripts/agents/find-linked-prs.mjs --repo "$REPO" --issue "$ISSUE" > /tmp/linked-prs.txt
          prs=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const list = readFileSync("/tmp/linked-prs.txt", "utf8")
              .split("\n").map((s) => s.trim()).filter(Boolean).map(Number);
            if (list.some((n) => !Number.isInteger(n))) process.exit(1);
            console.log(JSON.stringify(list));
          ')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          if [ "$prs" = "[]" ]; then
            echo "has_prs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_prs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Linked open PRs: $prs"

  freeze_marker:
    name: Post the signed amendment-freeze marker
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agents-contract-authority
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
      FROM_REVISION: ${{ needs.plan.outputs.from_revision }}
      # env-var indirection — dispatch inputs never touch shell syntax
      REVISION_INPUT: ${{ inputs.revision }}
    steps:
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          fetch-depth: 1

      - name: Freeze the merge contract (durable evaluator state)
        run: |
          set -euo pipefail
          node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
            --freeze --from "$FROM_REVISION" --target "$REVISION_INPUT" \
            --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post

  barrier:
    name: 'Barrier — force linked PR checks red'
    needs: [plan, freeze_marker]
    if: >-
      !cancelled() && needs.freeze_marker.result == 'success' &&
      needs.plan.outputs.has_prs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # barrier every PR we can; any failure still aborts the signing
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    # The SAME group as this PR's finalizer: after this job, every later
    # check writer for the PR read state that contains the freeze marker.
    concurrency:
      group: rekoda-gates-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          fetch-depth: 1

      - name: Force this PR's required checks red under the freeze
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/${{ matrix.pr }}" --jq '.head.sha')
          echo "Barrier for PR #${{ matrix.pr }} at $head — the freeze marker is durable; overwriting any pre-freeze conclusion…"
          for name in "Agent policy gate" "Technical Review Gate" "Gemini Acceptance Gate"; do
            node scripts/agents/post-check.mjs --repo "$REPO" --name "$name" --sha "$head" \
              --conclusion failure --title "Contract amendment in progress" \
              --summary "Issue #$ISSUE is under a signed amendment freeze; this check stays red until the new revision is signed and the gates re-evaluate under it."
          done

  sign:
    name: Sign and post the revision
    needs: [plan, freeze_marker, barrier]
    # Only when the freeze marker is durable AND every barrier completed
    # (or there was nothing to barrier). Any failure leaves the freeze
    # active: every linked PR stays evaluator-blocked until the owner
    # re-runs the amendment — never a silent re-green.
    if: >-
      !cancelled() && needs.freeze_marker.result == 'success' &&
      (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agents-contract-authority
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
      # env-var indirection — dispatch inputs never touch shell syntax
      REVISION_INPUT: ${{ inputs.revision }}
      REASON_INPUT: ${{ inputs.reason }}
    steps:
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          fetch-depth: 1

      - name: Post the signed revision marker (the authoritative transition; expires the freeze)
        run: |
          set -euo pipefail
          node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
            --revision "$REVISION_INPUT" --reason "$REASON_INPUT" \
            --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post

  dispatch:
    name: Redispatch the gates
    needs: [plan, sign]
    # A failed redispatch leaves the PR blocked (wrong-revision), never
    # silently green — the owner redispatches Agent — gates manually.
    if: >-
      !cancelled() && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The compact JSON list from the plan job — parsed with a real JSON
      # parser, via env (untrusted-shaped data never touches shell
      # syntax): [70,73] → 70 and 73, NEVER 7073.
      PRS_JSON: ${{ needs.plan.outputs.prs }}
    steps:
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          fetch-depth: 1

      - name: Redispatch Agent — gates for every linked PR
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { parsePrNumbersJson } from "./scripts/agents/evaluator.mjs";
            const prs = parsePrNumbersJson(process.env.PRS_JSON);
            if (prs === null) { console.error("::error::Linked-PR list is not a valid JSON array of PR numbers."); process.exit(1); }
            console.log(prs.join("\n"));
          ' > /tmp/prs.txt
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "Redispatching the gates for PR #$pr under the new revision."
            gh workflow run agent-gates.yml --repo "$REPO" --ref main -f pr="$pr"
          done < /tmp/prs.txt

  # ---------------------------------------------------------------- #
  # Baseline recording + builder hand-off                             #
  # (workflow_dispatch mode=baseline — the planner's explicit entry    #
  # point — or a human label event)                                   #
  # ---------------------------------------------------------------- #
  baseline:
    name: Record baseline and hand off (READY promotion)
    # Label path: any of the participating labels may arrive LAST; each
    # event only triggers a re-check — the decision is made against the
    # RE-FETCHED current labels (readyPromotionAction). Dispatch path:
    # the planner (or the owner) explicitly requests baseline recording;
    # the issue number is only a REQUEST and every fact is re-verified.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       (github.event.label.name == 'status:ready' ||
        github.event.label.name == 'agent-task' ||
        startsWith(github.event.label.name, 'builder:')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agents-contract-authority
    permissions:
      contents: read
      issues: write
      actions: write # deterministic builder dispatch after the baseline exists
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
      CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
    steps:
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authorize actor
        run: |
          set -euo pipefail
          # Trusted-workflow dispatch (the planner's GITHUB_TOKEN) appears
          # as github-actions[bot]; it can only originate from a trusted
          # default-branch workflow, and every issue fact is independently
          # re-verified below — the request itself grants nothing.
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Dispatched by a trusted default-branch workflow."
            exit 0
          fi
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "Actor $ACTOR permission: $perm" ;;
            *) echo "::error::Actor $ACTOR (permission: $perm) may not drive contract authority."; exit 1 ;;
          esac

      - name: Decide from the RE-FETCHED current labels
        id: promote
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/contract-revision.mjs ]; then
            echo "::error::Policy scripts are not on main yet."; exit 1
          fi
          gh api "repos/$REPO/issues/$ISSUE/labels" --paginate --jq '.[].name' > /tmp/labels.txt
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { readyPromotionAction } from "./scripts/agents/evaluator.mjs";
            const labels = readFileSync("/tmp/labels.txt", "utf8").split("\n").filter(Boolean);
            const d = readyPromotionAction({ labels });
            console.log(`proceed=${d.proceed}`);
            console.log(`dispatch_claude=${d.dispatchClaude}`);
          ' > /tmp/decision.txt
          cat /tmp/decision.txt >> "$GITHUB_OUTPUT"
          cat /tmp/decision.txt

      - name: Record the baseline and hand off to the builder
        if: steps.promote.outputs.proceed == 'true'
        env:
          DISPATCH_CLAUDE: ${{ steps.promote.outputs.dispatch_claude }}
        run: |
          set -euo pipefail
          # Baseline existence is decided by the SAME canonical parser/
          # provenance computation admission uses — NEVER a substring
          # probe: a comment that merely contains the marker name, a
          # malformed marker, an unsigned bot marker, a wrong-issue
          # marker or a bad signature does not suppress the real
          # baseline; conflicting AUTHORIZED history fails closed.
          node scripts/agents/contract-status.mjs --repo "$REPO" --issue "$ISSUE" > /tmp/status.txt
          cat /tmp/status.txt
          history_complete=$(grep '^history_complete=' /tmp/status.txt | cut -d= -f2)
          baseline_found=$(grep '^baseline_found=' /tmp/status.txt | cut -d= -f2)
          invalid=$(grep '^invalid=' /tmp/status.txt | cut -d= -f2-)
          if [ "$history_complete" != "true" ]; then
            echo "::error::Issue #$ISSUE comment history could not be proven complete; refusing to decide baseline existence."
            exit 1
          fi
          if [ -n "$invalid" ]; then
            echo "::error::Issue #$ISSUE carries INVALID authorized contract history ($invalid); this issue cannot proceed until the owner resolves it — not papering over it with a new baseline."
            exit 1
          fi
          if [ "$baseline_found" = "true" ]; then
            echo "A VALID authorized baseline already exists on #$ISSUE."
          else
            node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
              --baseline --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post
          fi
          # Deterministic sequencing (no builder polling): the builder is
          # dispatched only AFTER the baseline exists — admission then
          # independently verifies it again, and its atomic lane claim
          # makes a duplicate dispatch a safe no-op.
          if [ "$DISPATCH_CLAUDE" = "true" ]; then
            echo "Baseline recorded — dispatching the Claude builder for #$ISSUE."
            gh workflow run agent-claude.yml --repo "$REPO" --ref main -f issue="$ISSUE"
          else
            echo "Builder is not builder:claude — builder:codex lanes are claimed manually after this baseline."
          fi
