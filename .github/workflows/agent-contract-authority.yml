# Contract authority — the only workflow that can SIGN contract
# baseline/revision markers (docs/AUTONOMOUS-ENGINEERING.md §6).
# Deterministic, no AI. Its environment (agents-contract-authority)
# holds CONTRACT_AUTHORITY_SIGNING_KEY — a key the builder, planner and
# reviewers do not possess, which is what separates contract authority
# from everyone who merely wants the contract changed. The owner's human
# account is the other authorized source (unsigned; the platform proves
# a human authored it).
#
#   - When an agent-task issue is labelled status:ready by a write+
#     actor, it posts the signed REKODA_CONTRACT_BASELINE (revision 1)
#     if no baseline exists yet — recording, not amending.
#   - Amendments are workflow_dispatch only (write+ access required by
#     GitHub to dispatch): a signed REKODA_CONTRACT_REVISION with the
#     new hash and reason. The evaluator enforces monotonic history and
#     rejects conflicts, so a second conflicting baseline or a replayed
#     revision blocks the PR rather than changing anything.
name: Agent — contract authority

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to amend
        required: true
        type: number
      revision:
        description: New revision number (previous + 1)
        required: true
        type: number
      reason:
        description: Why the contract changed
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write # direct redispatch of Agent — gates / builder dispatch
  pull-requests: read
  checks: write # D1 freeze: forcing linked PRs' required checks red BEFORE a revision becomes authoritative — demonstrably required here and nowhere else outside the gates

concurrency:
  group: contract-authority-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  contract:
    name: Contract authority
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'status:ready' &&
       contains(github.event.issue.labels.*.name, 'agent-task'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agents-contract-authority
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ACTOR: ${{ github.actor }}
    steps:
      # issues/workflow_dispatch events execute the default-branch
      # definition; github.sha IS that trusted commit — definition and
      # policy share one immutable trust root.
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Trusted root
        run: echo "Definition and policy trust root — default-branch SHA ${{ github.sha }}"

      - name: Authorize actor
        env:
          OWNER_LOGIN: AngeloAkuhwa
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Contract AMENDMENTS after implementation begins are
            # OWNER-ONLY (docs/AUTONOMOUS-ENGINEERING.md §6): no write
            # collaborator may sign new requirements.
            if [ "$ACTOR" != "$OWNER_LOGIN" ]; then
              echo "::error::Contract amendments are owner-only; actor $ACTOR is not @$OWNER_LOGIN."
              exit 1
            fi
          else
            # Baseline recording on READY promotion: write+ actor.
            perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
            case "$perm" in
              admin|maintain|write) echo "Actor $ACTOR permission: $perm" ;;
              *) echo "::error::Actor $ACTOR (permission: $perm) may not drive contract authority."; exit 1 ;;
            esac
          fi

      - name: Amend the contract as a FREEZE-BEFORE-MUTATE transaction (revisions)
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
          # env-var indirection — dispatch inputs never touch shell syntax
          REVISION_INPUT: ${{ inputs.revision }}
          REASON_INPUT: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/contract-revision.mjs ]; then
            echo "::error::Policy scripts are not on main yet."; exit 1
          fi
          # D1 invariant: the active contract never changes while linked
          # PRs remain merge-authorizing under the previous contract.
          # This step follows scripts/agents/evaluator.mjs
          # amendmentTransaction() exactly:
          #   1. find every linked open PR (exhaustive; unprovable → abort);
          #   2. FREEZE each one's CURRENT HEAD — force all three required
          #      checks to failure — BEFORE anything else; any freeze
          #      failure aborts with the previous revision still active
          #      (already-frozen PRs stay safely blocked);
          #   3. only after every freeze is confirmed, sign and post the
          #      revision marker (this is the authoritative transition);
          #   4. redispatch the gates; a failed dispatch leaves the PR
          #      frozen (blocked), never silently green.
          node scripts/agents/find-linked-prs.mjs --repo "$REPO" --issue "$ISSUE" > /tmp/linked-prs.txt
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
            echo "Freezing PR #$pr at $head before the amendment becomes authoritative…"
            for name in "Agent policy gate" "Technical Review Gate" "Gemini Acceptance Gate"; do
              node scripts/agents/post-check.mjs --repo "$REPO" --name "$name" --sha "$head" \
                --conclusion failure --title "Contract amendment in progress" \
                --summary "Issue #$ISSUE is being amended to revision $REVISION_INPUT; this check stays red until the gates re-evaluate under the new contract."
            done
          done < /tmp/linked-prs.txt
          echo "All linked PRs frozen — committing revision $REVISION_INPUT."
          node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
            --revision "$REVISION_INPUT" --reason "$REASON_INPUT" \
            --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "Redispatching the gates for PR #$pr under revision $REVISION_INPUT."
            gh workflow run agent-gates.yml --repo "$REPO" --ref main -f pr="$pr"
          done < /tmp/linked-prs.txt

      - name: Record the baseline and hand off to the builder (READY promotion)
        if: github.event_name != 'workflow_dispatch'
        env:
          CONTRACT_AUTHORITY_SIGNING_KEY: ${{ secrets.CONTRACT_AUTHORITY_SIGNING_KEY }}
          HAS_CLAUDE_BUILDER: ${{ contains(github.event.issue.labels.*.name, 'builder:claude') }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/contract-revision.mjs ]; then
            echo "::error::Policy scripts are not on main yet."; exit 1
          fi
          # Baseline: record once; never overwrite an existing baseline.
          if gh api "repos/$REPO/issues/$ISSUE/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("REKODA_CONTRACT_BASELINE"))] | length' | grep -qv '^0$'; then
            echo "A baseline marker already exists on #$ISSUE."
          else
            node scripts/agents/contract-revision.mjs --repo "$REPO" --issue "$ISSUE" \
              --baseline --sign-env CONTRACT_AUTHORITY_SIGNING_KEY --post
          fi
          # Deterministic sequencing (no builder polling): the builder is
          # dispatched only AFTER the baseline exists — admission then
          # independently verifies it again.
          if [ "$HAS_CLAUDE_BUILDER" = "true" ]; then
            echo "Baseline recorded — dispatching the Claude builder for #$ISSUE."
            gh workflow run agent-claude.yml --repo "$REPO" --ref main -f issue="$ISSUE"
          else
            echo "No builder:claude label — builder:codex lanes are claimed manually after this baseline."
          fi
