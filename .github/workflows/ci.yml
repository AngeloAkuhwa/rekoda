name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets never enter this repository. Scans the full history on every push.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Becomes typecheck + lint + test + build once the M0 scaffold lands.
  # Guarded so the workflow is green (not red) while the repo is docs-only.
  build-test:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect workspace
        id: ws
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Node
        if: steps.ws.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        if: steps.ws.outputs.present == 'true'
        run: corepack enable
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, build
        if: steps.ws.outputs.present == 'true'
        run: pnpm turbo typecheck lint test build
      - name: Docs-only repository — nothing to build yet
        if: steps.ws.outputs.present == 'false'
        run: echo "No pnpm workspace yet (pre-M0). Skipping build steps."
