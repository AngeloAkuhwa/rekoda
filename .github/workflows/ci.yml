name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets never enter this repository. Scans the FULL history every run.
  #
  # gitleaks is invoked directly rather than through gitleaks-action, because
  # the action scans a `<oldest-commit>^..<head>` range on pull_request events.
  # This repository has two root commits (the initial README, and the M0
  # foundation delivered as a bundle), and a root commit has no parent — so the
  # range fails to resolve and the action exits non-zero having scanned nothing.
  # Scanning the whole history is also what the job claims to do.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose

  # Becomes typecheck + lint + test + build once the M0 scaffold lands.
  # Guarded so the workflow is green (not red) while the repo is docs-only.
  build-test:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Node
        if: steps.ws.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        if: steps.ws.outputs.present == 'true'
        run: corepack enable
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, build
        if: steps.ws.outputs.present == 'true'
        run: pnpm turbo typecheck lint test build
      # withBusiness() is only a tenancy guarantee if it is the only path to the
      # database. This is what stops that decaying into a convention.
      - name: Architectural boundaries
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-boundaries.mjs
      - name: Docs-only repository — nothing to build yet
        if: steps.ws.outputs.present == 'false'
        run: echo "No pnpm workspace yet (pre-M0). Skipping build steps."


  # Integration tests need a REAL PostgreSQL: row-level security, advisory locks
  # and ON CONFLICT races have no meaningful in-memory imitation, and a mock of
  # the thing under test would prove nothing. These suites FAIL rather than skip
  # when the database is absent, so a green tick here cannot mean "ran nothing".
  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekoda
          POSTGRES_DB: rekoda
          # No password, deliberately. The container is job-scoped, reachable
          # only on loopback, and destroyed with the runner — so a hardcoded
          # password would protect nothing while looking exactly like a leaked
          # credential to every secret scanner pointed at this repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekoda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Migrations run as the owner; the application runs as `rekoda_app`, which
      # is NOT the table owner and has no BYPASSRLS. Testing through a superuser
      # would make every tenancy assertion pass for the wrong reason.
      DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda
      APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # The migration creates rekoda_app with no password on purpose —
      # credentials belong to ops, never to a file in the repository. Under
      # trust auth it needs none here.
      - name: Apply migrations
        run: pnpm --filter @rekoda/db migrate:apply
      - name: Tenancy and identity integration tests
        run: pnpm --filter @rekoda/db test:integration
      - name: API integration tests
        run: pnpm --filter @rekoda/api test:integration

  # The web app's behaviour lives in routing, guards and server actions, which
  # only a real browser exercises. Runs the FULL stack against a PRODUCTION
  # build — Next.js, the Nest API and PostgreSQL — so the assertions cover what
  # ships: dev-only branches off, cookies set as they will be, and identity
  # decided by rows rather than by a process that dies with the test.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekoda
          POSTGRES_DB: rekoda
          # No password, deliberately. The container is job-scoped, reachable
          # only on loopback, and destroyed with the runner — so a hardcoded
          # password would protect nothing while looking exactly like a leaked
          # credential to every secret scanner pointed at this repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekoda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda
      APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Split deliberately. `--with-deps` shells out to apt-get, which has
      # wedged this job for 25 minutes with no output and no failure — a hang
      # burns runner minutes up to the six-hour default before anyone finds
      # out. The apt half is best-effort because the ubuntu-latest image
      # already ships the libraries Chromium needs; the download half is not.
      - name: Install Chromium system dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm --filter @rekoda/web exec playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @rekoda/web exec playwright install chromium
      - name: Build
        run: pnpm turbo build
      - name: Apply migrations
        run: pnpm --filter @rekoda/db migrate:apply
      - name: Run end-to-end tests
        run: pnpm --filter @rekoda/web exec playwright test
        env:
          # CI has no pre-installed browser at a fixed path, so let Playwright
          # resolve the one it just installed.
          REKODA_CHROME: ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
