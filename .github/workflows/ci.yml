name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run. A run on main is
# never cancelled: staging deploys only a commit whose push run on main
# succeeded (deploy-staging.yml), so a second merge must not cancel the first
# merge's run. At most one newer run waits behind it and GitHub drops older
# waiting ones. This workflow does not make merges serial: taking one merge at a
# time (docs/runbooks/pr-quality-pipeline.md) is an operating procedure.
# scripts/check-staging-deploy.mjs keeps the cancellation rule.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Secrets never enter this repository. Scans the FULL history every run.
  #
  # gitleaks is invoked directly rather than through gitleaks-action, because
  # the action scans a `<oldest-commit>^..<head>` range on pull_request events.
  # This repository has two root commits (the initial README, and the M0
  # foundation delivered as a bundle), and a root commit has no parent — so the
  # range fails to resolve and the action exits non-zero having scanned nothing.
  # Scanning the whole history is also what the job claims to do.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose

  # Becomes typecheck + lint + test + build once the M0 scaffold lands.
  # Guarded so the workflow is green (not red) while the repo is docs-only.
  build-test:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Node
        if: steps.ws.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        if: steps.ws.outputs.present == 'true'
        run: corepack enable
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, build
        if: steps.ws.outputs.present == 'true'
        run: pnpm turbo typecheck lint test build
      # withBusiness() is only a tenancy guarantee if it is the only path to the
      # database. This is what stops that decaying into a convention.
      - name: Architectural boundaries
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-boundaries.mjs
      # A deployment is filled from .env.example. Every name the code reads
      # must be in it and every name in it must be read (G-08). The fixture
      # test pins every read form the scanner handles; it runs first.
      - name: Environment template matches the code
        if: steps.ws.outputs.present == 'true'
        run: node --test scripts/check-env-example.test.mjs && node scripts/check-env-example.mjs
      # The production deployment keeps its shape: only Caddy publishes a port,
      # the owner credential reaches postgres and the migrate job only, the
      # images run as non-root and are built from no secret (G-01).
      - name: Deployment files keep their shape
        if: steps.ws.outputs.present == 'true'
        run: node --test scripts/check-deploy.test.mjs scripts/check-deploy-privileged.test.mjs && node scripts/check-deploy.mjs
      # The vendored design skills (.claude/skills, SOURCES.md) stay what was
      # reviewed: each folder hashes to its recorded value and no ignore rule
      # drops part of one, as `data/` once did to Impeccable's font index.
      # Not gated on the workspace: it needs only git and Node, and a docs-only
      # state must not let a vendored file drift through unchecked.
      - name: Vendored skills match their recorded hashes
        run: node --test scripts/check-vendored-skills.test.mjs scripts/vendored-skills-hardening.test.mjs && node scripts/check-vendored-skills.mjs
      # The backup and restore-drill scripts (G-02): encrypted, checksummed,
      # fail-closed, scratch-only restore.
      - name: Backup scripts keep their contract
        if: steps.ws.outputs.present == 'true'
        run: |
          bash -n scripts/backup-db.sh
          bash -n scripts/restore-drill.sh
          bash -n scripts/lib/backup-common.sh
          node --test scripts/backup-scripts.test.mjs
      # Staging deploys itself after this workflow passes on main
      # (deploy-staging.yml running scripts/deploy-staging.sh on the host).
      # Both must keep performing the runbook's "Deploy a release", and keep
      # what makes that safe unattended: the exact commit, one at a time, a
      # pinned host key, no secret in GitHub, nothing destructive.
      - name: Staging deployment follows the runbook
        if: steps.ws.outputs.present == 'true'
        run: |
          bash -n scripts/deploy-staging.sh
          bash -n scripts/staging-readonly-check.sh
          node --test scripts/check-staging-deploy.test.mjs scripts/check-staging-deploy.tools.test.mjs scripts/deploy-staging-interrupt.test.mjs scripts/deploy-staging-compat.test.mjs scripts/deploy-staging-envfile.test.mjs scripts/staging-readonly-check.test.mjs scripts/staging-readonly-check.services.test.mjs scripts/staging-readonly-check.templates.test.mjs && node scripts/check-staging-deploy.mjs
      # One Node version, and an LTS. `.nvmrc` is the source of truth; this
      # checks engines, every @types/node, AND the version actually running,
      # because a project can be consistent in four files and still be tested
      # on a fifth version nobody declared.
      - name: Node version is single and LTS
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-node-version.mjs
      # Owner's rule: no em/en dashes in anything a user reads. Copy must read
      # like a person wrote it; comments can punctuate however they like.
      - name: UI copy reads human
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-ui-copy.mjs
      - name: Retired claims stay retired
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-retired-claims.mjs
      # Every PR that touches a route can silently make the published
      # reference wrong, and a developer builds against that reference.
      # Test files follow one layout (CONTRIBUTING, "Where tests go"). Oversized
      # files are held by a size ratchet (scripts/test-layout-baseline.json). On a
      # pull request the target branch's baseline is fetched so the baseline file
      # cannot gain or raise an entry. The remaining baselined files are reported,
      # not failed, until the baseline is empty (--strict).
      - name: Test layout
        if: steps.ws.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node --test scripts/check-test-layout.test.mjs
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/check-test-layout.mjs --base-ref FETCH_HEAD
          else
            node scripts/check-test-layout.mjs
          fi
      # A document is numbered with the Lagos year it is issued in, so an integration test that
      # issues one now and asserts a literal year fails on 1 January. New literals need a
      # `// fixed date:` or `// not issued:` note; lines already on the base branch are not read.
      - name: Test document years
        if: steps.ws.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node --test scripts/check-test-years.test.mjs
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/check-test-years.mjs --base-ref FETCH_HEAD
          else
            node scripts/check-test-years.mjs
          fi
      - name: The API reference describes the API
        if: steps.ws.outputs.present == 'true'
        run: node scripts/check-openapi.mjs
      - name: Docs-only repository — nothing to build yet
        if: steps.ws.outputs.present == 'false'
        run: echo "No pnpm workspace yet (pre-M0). Skipping build steps."

  # The production stack, from a clean checkout on a clean machine (G-01):
  # built, migrated as the owner, booted behind Caddy over HTTPS, attacked
  # (secrets in layers, root, the owner credential, a forged X-Forwarded-For),
  # restarted and rolled back, following docs/runbooks/deploy.md step for
  # step. scripts/deploy-smoke.sh says what each step proves.
  deployment:
    name: Deployment (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Boot, attack, restart and roll back the production stack
        run: bash scripts/deploy-smoke.sh

  # Every migration, replayed on a cluster that has never heard of us
  # (remediation R10).
  #
  # The integration job below runs as `rekoda`, so a migration that names
  # that role is green there whether or not the name is earned. Migration
  # 0058 did exactly that: `GRANT EXECUTE ... TO rekoda` is a valid
  # statement only where a role of that name already exists, and on a
  # cluster provisioned with any other owner it aborted. The bug was
  # invisible to CI precisely because CI shared the assumption.
  #
  # So this container is provisioned with a DIFFERENT owner and no `rekoda`
  # role at all. It applies the migrations and stops: this asks whether the
  # schema can be BUILT anywhere, which the suites below cannot ask because
  # they need the database they run against to be ours.
  migrations-portable:
    name: Migrations (foreign owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Deliberately not `rekoda`, and deliberately unlike it: the point
          # is a cluster where nothing we might accidentally name exists.
          POSTGRES_USER: someone_else
          POSTGRES_DB: someone_elses_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U someone_else -d someone_elses_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://someone_else@127.0.0.1:5432/someone_elses_db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The whole graph, as the integration job does: @rekoda/db compiles
      # against @rekoda/core, so building it alone fails on the import.
      - run: pnpm turbo build
      - name: Apply every migration as a foreign owner
        run: pnpm --filter @rekoda/db migrate:apply
      - name: No migration may depend on our owner's name
        run: |
          if psql "$DATABASE_URL" -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'rekoda'" | grep -q 1; then
            echo "A migration created a role named 'rekoda'." >&2
            echo "The schema must not assume the owner is called that." >&2
            exit 1
          fi

  # Integration tests need a REAL PostgreSQL: row-level security, advisory locks
  # and ON CONFLICT races have no meaningful in-memory imitation, and a mock of
  # the thing under test would prove nothing. These suites FAIL rather than skip
  # when the database is absent, so a green tick here cannot mean "ran nothing".
  integration:
    name: Integration (${{ matrix.suite }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Each suite runs in two shards, and every shard is its own job with its own
    # PostgreSQL service container, so no two shards share a database and the
    # truncate-between-tests isolation is unchanged. Vitest's --shard splits the
    # suite's test FILES between the shards; together they run every file once.
    # fail-fast is off so one failing shard does not hide another's result.
    strategy:
      fail-fast: false
      matrix:
        suite: [db, api]
        shard: [1, 2]
        include:
          # The step keeps the name each suite's step has always had.
          - suite: db
            step: Tenancy and identity integration tests
          - suite: api
            step: API integration tests
    # A hang-guard, not a performance budget. One shard is about half a suite
    # (the API suite alone took ~11 minutes serially), so 30 leaves headroom for a
    # slow runner while a wedged shard still dies well before the runner's limit.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekoda
          POSTGRES_DB: rekoda
          # No password, deliberately. The container is job-scoped, reachable
          # only on loopback, and destroyed with the runner — so a hardcoded
          # password would protect nothing while looking exactly like a leaked
          # credential to every secret scanner pointed at this repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekoda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Migrations run as the owner; the application runs as `rekoda_app`, which
      # is NOT the table owner and has no BYPASSRLS. Testing through a superuser
      # would make every tenancy assertion pass for the wrong reason.
      DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda
      APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda
      # The worker role. Separate from APP_DATABASE_URL on purpose — the queue
      # tests assert that the application's credentials CANNOT claim a job, and
      # running both roles through one connection string would make that
      # assertion pass for the wrong reason (ADR 0022).
      WORKER_DATABASE_URL: postgres://rekoda_worker@127.0.0.1:5432/rekoda
      # OD-37 (migration 0202): the settlement and billing-operator principals, each its own
      # connection string, so a test that settles or changes a plan through the general credential
      # fails for the right reason.
      SETTLEMENT_DATABASE_URL: postgres://rekoda_settlement@127.0.0.1:5432/rekoda
      OPERATOR_DATABASE_URL: postgres://rekoda_billing_operator@127.0.0.1:5432/rekoda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # The recovery drill dumps with the runner's own `pg_dump` and restores into
      # the postgres:16 service container. A client newer than the server writes
      # `SET transaction_timeout` (a PostgreSQL 17 setting) into the archive and a
      # 16 server rejects it on restore, so the client must match the server. The
      # runner image no longer ships 16 (ubuntu-latest moved to a release whose
      # default is 18), so install it when it is missing. A failed install stops
      # the job here, with the reason, rather than drifting into a confusing
      # restore failure later.
      - name: Use the PostgreSQL 16 client tools
        run: |
          if [ -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
            PATH="/usr/lib/postgresql/16/bin:$PATH"
          else
            # No native 16 client on this image: run the postgres:16 image's
            # tools through the wrappers (they use the host network).
            client="$GITHUB_WORKSPACE/scripts/ci-pg16-client"
            echo "$client" >> "$GITHUB_PATH"
            PATH="$client:$PATH"
          fi
          # Fail here, not in a confusing restore error later, if the client
          # the drill will use is not the server's major version.
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 16\.' ||
            { echo "pg_dump is not PostgreSQL 16" >&2; exit 1; }
          pg_dump --version
      # The migration creates rekoda_app with no password on purpose —
      # credentials belong to ops, never to a file in the repository. Under
      # trust auth it needs none here.
      - name: Apply migrations
        run: pnpm --filter @rekoda/db migrate:apply
      # vitest is called directly so --shard reaches it as an option (an extra
      # `--` through `pnpm run` would turn it into a file filter). The config is
      # the same one `test:integration` uses. A shard that matches no test file
      # fails ("No test files found") rather than passing empty.
      - name: ${{ matrix.step }}
        run: >-
          pnpm --filter "@rekoda/${{ matrix.suite }}" exec
          vitest run --config vitest.integration.config.ts
          --shard=${{ matrix.shard }}/2

  # The single check named "Integration (PostgreSQL)", kept so branch rules and the
  # runbook's required-check list need no change. It runs even when a shard failed
  # or was cancelled (always()) and passes ONLY when every shard succeeded. The
  # matrix result alone is not trusted: a matrix leg cancelled before it got a
  # runner has been reported to leave that result at "success". So the job also
  # reads this run's jobs from the Actions API (newest attempt of each) and
  # requires exactly four shard jobs, each concluded "success". A missing,
  # skipped, cancelled or failed shard therefore can never read as green.
  integration-check:
    name: Integration (PostgreSQL)
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every integration shard ran and passed
        env:
          SHARDS: ${{ needs.integration.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "integration matrix result: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "An integration shard did not succeed (result: $SHARDS)." >&2
            exit 1
          fi
          # filter=all, then the newest attempt of each shard: a partial re-run of one
          # failed shard leaves the passing shards' jobs in the earlier attempt.
          shards=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
            --jq '[.jobs[] | select(.name | test("^Integration \\((db|api) [12]/2\\)$"))]
                  | group_by(.name) | map(max_by(.run_attempt))')
          echo "$shards" | jq -r '.[] | "\(.name): \(.status) \(.conclusion)"'
          total=$(echo "$shards" | jq 'length')
          passed=$(echo "$shards" | jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$total" -ne 4 ] || [ "$passed" -ne 4 ]; then
            echo "Expected 4 integration shard jobs, all successful; found $total, $passed successful." >&2
            exit 1
          fi

  # The web app's behaviour lives in routing, guards and server actions, which
  # only a real browser exercises. Runs the FULL stack against a PRODUCTION
  # build — Next.js, the Nest API and PostgreSQL — so the assertions cover what
  # ships: dev-only branches off, cookies set as they will be, and identity
  # decided by rows rather than by a process that dies with the test.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekoda
          POSTGRES_DB: rekoda
          # No password, deliberately. The container is job-scoped, reachable
          # only on loopback, and destroyed with the runner — so a hardcoded
          # password would protect nothing while looking exactly like a leaked
          # credential to every secret scanner pointed at this repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekoda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda
      APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Split deliberately. `--with-deps` shells out to apt-get, which has
      # wedged this job for 25 minutes with no output and no failure — a hang
      # burns runner minutes up to the six-hour default before anyone finds
      # out. The apt half is best-effort because the ubuntu-latest image
      # already ships the libraries Chromium needs; the download half is not.
      - name: Install Chromium system dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm --filter @rekoda/web exec playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @rekoda/web exec playwright install chromium
      - name: Build
        run: pnpm turbo build
      - name: Apply migrations
        run: pnpm --filter @rekoda/db migrate:apply
      - name: Run end-to-end tests
        run: pnpm --filter @rekoda/web exec playwright test
        env:
          # CI has no pre-installed browser at a fixed path, so let Playwright
          # resolve the one it just installed.
          REKODA_CHROME: ''
      # The paid-plan journey runs its own API (a Paystack test key aimed at a stand-in, the
      # worker in-process), so it needs a database that has not been enrolled with the first
      # run's random keys. It gets its own empty database beside the first; nothing is dropped.
      - name: Create a separate database for the purchase journey
        run: psql postgres://rekoda@127.0.0.1:5432/postgres -c 'CREATE DATABASE rekoda_journey'
      - name: Run the purchase journey (Paystack stand-in)
        run: pnpm --filter @rekoda/web e2e:journey
        env:
          REKODA_CHROME: ''
          DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda_journey
          APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda_journey
          WORKER_DATABASE_URL: postgres://rekoda_worker@127.0.0.1:5432/rekoda_journey
      # The reminder screens run their own API too (reminders released, mail kept in memory by
      # the mock sender), with a random vault key the spec seals a customer address with, so
      # they get a database of their own as well.
      - name: Create a separate database for the reminder screens
        run: psql postgres://rekoda@127.0.0.1:5432/postgres -c 'CREATE DATABASE rekoda_reminders'
      - name: Run the reminder screens (mock email)
        run: pnpm --filter @rekoda/web e2e:reminders
        env:
          REKODA_CHROME: ''
          DATABASE_URL: postgres://rekoda@127.0.0.1:5432/rekoda_reminders
          APP_DATABASE_URL: postgres://rekoda_app@127.0.0.1:5432/rekoda_reminders
          WORKER_DATABASE_URL: postgres://rekoda_worker@127.0.0.1:5432/rekoda_reminders
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
