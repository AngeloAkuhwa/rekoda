# The deterministic merge gate for agent work (docs/AUTONOMOUS-ENGINEERING.md §6).
#
# Inspects only structured GitHub data — labels, the PR body, the reviews
# API, review-thread resolution — never free-text scraping. PRs without a
# risk:* label (humans, Dependabot) pass neutrally: the gate governs agent
# work.
#
# Codex signal, honestly: OpenAI's native integration posts a real PR
# review as chatgpt-codex-connector[bot], and each review carries a
# commit_id. That is the only reliable machine signal it offers — it is
# not documented to APPROVE, and it is not guaranteed to re-review every
# push. So the gate requires "a Codex review exists for the current HEAD
# SHA" and tells you to comment `@codex review` when one does not. It
# never infers approval from silence.
#
# Uses only the read-only GITHUB_TOKEN — safe on fork PRs, no environment
# secrets.
name: Agent policy gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Stable name — this is what branch protection requires.
    name: Agent policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER_LOGIN: AngeloAkuhwa
      CODEX_LOGIN: chatgpt-codex-connector[bot]
    steps:
      - name: Evaluate policy
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; FAILED=1; }
          FAILED=0

          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          body=$(jq -r '.body // ""' <<<"$pr_json")
          labels=$(jq -r '.labels[].name' <<<"$pr_json")

          risk_labels=$(grep -E '^risk:R[0-3]$' <<<"$labels" || true)
          risk_count=$(grep -c . <<<"$risk_labels" || true)

          if [ "$risk_count" -eq 0 ]; then
            echo "No risk:* label — not an agent-governed PR. Gate passes neutrally."
            exit 0
          fi
          if [ "$risk_count" -gt 1 ]; then
            fail "Exactly one risk:R0..R3 label is required; found: $(tr '\n' ' ' <<<"$risk_labels")"
          fi
          risk=$(head -n1 <<<"$risk_labels" | sed 's/^risk://')
          echo "Risk level: $risk · HEAD: $head_sha"

          # Linked issue: a closing keyword in the body.
          if ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<<"$body"; then
            fail "PR body must link its issue with a closing keyword (e.g. 'Closes #123')."
          fi

          # One page of 100 is deliberate: --paginate concatenates JSON
          # arrays, which breaks jq; a PR with more than 100 reviews has
          # bigger problems than this gate.
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100")

          if [ "$risk" != "R0" ]; then
            # Codex must have reviewed the CURRENT head.
            codex_on_head=$(jq -r --arg u "$CODEX_LOGIN" --arg sha "$head_sha" \
              '[.[] | select(.user.login == $u and .commit_id == $sha)] | length' <<<"$reviews")
            if [ "$codex_on_head" -eq 0 ]; then
              fail "No Codex review of HEAD $head_sha. Comment '@codex review' and re-run this check when the review lands."
            fi

            # No unresolved review threads.
            owner=${REPO%/*}; name=${REPO#*/}
            unresolved=$(gh api graphql \
              -f query='query($o:String!,$n:String!,$pr:Int!){repository(owner:$o,name:$n){pullRequest(number:$pr){reviewThreads(first:100){nodes{isResolved}}}}}' \
              -f o="$owner" -f n="$name" -F pr="$PR" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            if [ "$unresolved" -gt 0 ]; then
              fail "$unresolved unresolved review thread(s). Fix or answer-with-evidence, then resolve them."
            fi
          fi

          if [ "$risk" = "R3" ]; then
            # The owner must have APPROVED the current head, explicitly.
            owner_approved=$(jq -r --arg u "$OWNER_LOGIN" --arg sha "$head_sha" \
              '[.[] | select(.user.login == $u and .commit_id == $sha and .state == "APPROVED")] | length' <<<"$reviews")
            if [ "$owner_approved" -eq 0 ]; then
              fail "R3 requires @$OWNER_LOGIN's approving review of HEAD $head_sha (a fresh approval after every push, deliberately)."
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Agent policy gate failed — see docs/AUTONOMOUS-ENGINEERING.md §6."
            exit 1
          fi
          echo "Agent policy gate passed for $risk at $head_sha."
