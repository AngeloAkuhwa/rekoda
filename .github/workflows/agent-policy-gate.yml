# The deterministic merge-policy gate (docs/AUTONOMOUS-ENGINEERING.md §6).
#
# All policy logic lives in scripts/agents/evaluator.mjs — pure,
# network-free, and proven by scripts/agents/evaluator.test.mjs, which
# runs as a self-test on every gate run. This workflow only fetches and
# normalizes GitHub state (scripts/agents/normalize.mjs) and reports the
# evaluator's verdict. Scripts and policy are always loaded from the
# TRUSTED default branch, never from the PR under evaluation.
#
# Gate scope (mode 'policy'): label integrity, authoritative linked-issue
# resolution, issue↔PR risk/builder consistency, contract
# baseline/revision integrity (unauthorized amendment blocks), unresolved
# threads, and the R3 owner decision + owner approval of the exact HEAD.
# The reviewer verdicts are owned by the dedicated required checks
# 'Technical Review Gate' and 'Gemini Acceptance Gate'; branch protection
# composes all three, so this gate does not race them.
#
# Neutrality: a PR is agent-governed if it carries risk:*/builder:* labels
# OR closes an agent-task issue — removing a label is not an escape
# hatch. Everything else (humans, Dependabot) passes neutrally.
#
# Read-only GITHUB_TOKEN; no environment secrets; safe on fork PRs.
name: Agent policy gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate (used by the contract-watch dispatcher after issue-contract changes)
        required: true
        type: number

# Least privilege: read-only everywhere — this gate only reads state and
# reports its own check conclusion. No id-token (no OIDC), no writes.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: policy-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    # Stable name — this is what branch protection requires.
    name: Agent policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      HAS_AGENT_LABELS: ${{ contains(join(github.event.pull_request.labels.*.name, ','), 'risk:R') || contains(join(github.event.pull_request.labels.*.name, ','), 'builder:') }}
    steps:
      - name: Resolve the immutable trusted-governance SHA
        id: trusted
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/heads/main" --jq .sha)
          echo "Trusted governance SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted policy at that exact SHA (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          fetch-depth: 1

      - name: Bootstrap guard
        id: bootstrap
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/evaluator.mjs ]; then
            if [ "$HAS_AGENT_LABELS" = "true" ]; then
              echo "::error::Agent-labelled PR but the policy scripts are not on main yet."
              exit 1
            fi
            echo "Policy scripts not on main yet and no agent labels — neutral pass (bootstrap)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Evaluator self-test (behavioural evidence, every run)
        if: steps.bootstrap.outputs.ready == 'true'
        run: node --test scripts/agents/evaluator.test.mjs

      - name: Normalize GitHub state
        if: steps.bootstrap.outputs.ready == 'true'
        id: ctx
        run: |
          set -euo pipefail
          node scripts/agents/normalize.mjs --repo "$REPO" --pr "$PR" --out /tmp/state.json
          node scripts/agents/run-gate.mjs --state /tmp/state.json --print-context

      - name: Evaluate policy
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.ctx.outputs.governed }}" != "true" ]; then
            echo "Not an agent-governed PR — gate passes neutrally."
            exit 0
          fi
          node scripts/agents/run-gate.mjs --state /tmp/state.json --mode policy
