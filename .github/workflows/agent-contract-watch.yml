# Contract watch — the no-secret dispatcher for HUMAN contract-relevant
# issue changes (docs/AUTONOMOUS-ENGINEERING.md §6): when a person edits
# an agent-task issue's body, changes its risk/builder/status/decision
# labels, or posts contract evidence, the open PR closing that issue
# gets the privileged gates re-run against the same HEAD and the NEW
# contract state.
#
# The contract-authority WORKFLOW does not rely on this watcher at all —
# GitHub suppresses workflow events created by GITHUB_TOKEN comments, so
# the authority dispatches the gates itself directly. That suppression
# is a feature here: the gates' own marker comments can never self-
# trigger loops through this watcher either.
#
# No environment, no AI secrets: an arbitrary issue comment can never
# reach a secret-bearing job from here — this job only calls
# workflow_dispatch of the privileged gates, which re-resolve everything
# themselves.
name: Agent — contract watch

on:
  issues:
    types: [edited, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write # workflow_dispatch of the three gates; nothing else

concurrency:
  group: contract-watch-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  redispatch:
    name: Contract watch
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'agent-task') &&
      (
        (github.event_name == 'issues' && github.event.action == 'edited') ||
        (github.event_name == 'issues' &&
         (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         (startsWith(github.event.label.name, 'risk:') ||
          startsWith(github.event.label.name, 'builder:') ||
          startsWith(github.event.label.name, 'status:') ||
          github.event.label.name == 'needs-owner-decision')) ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, 'REKODA_CONTRACT'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      # issues/issue_comment events execute the default-branch
      # definition; github.sha IS that trusted commit.
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Trusted root
        run: echo "Definition and policy trust root — default-branch SHA ${{ github.sha }}"

      - name: Re-run the gates on every open PR closing this issue
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/evaluator.mjs ]; then
            echo "Policy scripts not on main yet — nothing to dispatch."; exit 0
          fi
          gh api "repos/$REPO/pulls?state=open&per_page=100" > /tmp/open-prs.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { linkedOpenPrs } from "./scripts/agents/evaluator.mjs";
            const prs = JSON.parse(readFileSync("/tmp/open-prs.json", "utf8"));
            console.log(linkedOpenPrs(prs, Number(process.env.ISSUE)).join("\n"));
          ' > /tmp/linked-prs.txt
          if [ ! -s /tmp/linked-prs.txt ]; then
            echo "No open PR closes #$ISSUE — nothing to re-run."
            exit 0
          fi
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "Issue #$ISSUE changed — re-dispatching the privileged gates for PR #$pr at its current HEAD."
            gh workflow run agent-gates.yml --repo "$REPO" --ref main -f pr="$pr"
          done < /tmp/linked-prs.txt
