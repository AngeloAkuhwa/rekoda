# Contract watch — the no-secret dispatcher for HUMAN contract-relevant
# issue changes (docs/AUTONOMOUS-ENGINEERING.md §6): when a person edits
# an agent-task issue's body, changes its risk/builder/status/decision
# labels, or posts contract evidence, the open PR closing that issue
# gets the privileged gates re-run against the same HEAD and the NEW
# contract state.
#
# ONE proposal semantic (D1): every event this watcher sees is at most
# a PROPOSED contract change or a state signal — a body edit, an
# owner-typed marker, a label flip. None of it moves the active merge
# contract: only the contract-authority's owner-dispatched
# freeze-before-mutate transaction makes a revision authoritative. A
# pending proposal makes the gates' contract_ok false (the body no
# longer matches the active revision's hash), which BLOCKS the gates,
# stops reviewer lanes from running, and stops publishers from signing
# — and V2 verdicts bind the reviewed snapshot's CONTRACT_BODY_SHA256,
# so no verdict produced over other text can authorize anything. The
# D1 merge window cannot be reopened from here.
#
# DELIVERY GUARANTEE: every dispatch below reaches an evaluation. The
# gates workflow has no workflow-level concurrency group, so a request
# cannot be displaced out of a pending slot by a later request; this
# watcher's own per-issue group only collapses rapid same-issue events
# into a newer run that re-dispatches against strictly fresher state.
#
# The contract-authority WORKFLOW does not rely on this watcher at all —
# GitHub suppresses workflow events created by GITHUB_TOKEN comments, so
# the authority dispatches the gates itself directly. That suppression
# is a feature here: the gates' own marker comments can never self-
# trigger loops through this watcher either.
#
# No environment, no AI secrets: an arbitrary issue comment can never
# reach a secret-bearing job from here — this job only calls
# workflow_dispatch of the privileged gates, which re-resolve everything
# themselves.
name: Agent — contract watch

on:
  issues:
    types: [edited, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write # workflow_dispatch of the three gates; nothing else

concurrency:
  group: contract-watch-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  redispatch:
    name: Contract watch
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'agent-task') &&
      (
        (github.event_name == 'issues' && github.event.action == 'edited') ||
        (github.event_name == 'issues' &&
         (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         (startsWith(github.event.label.name, 'risk:') ||
          startsWith(github.event.label.name, 'builder:') ||
          startsWith(github.event.label.name, 'status:') ||
          github.event.label.name == 'needs-owner-decision')) ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, 'REKODA_CONTRACT'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      # issues/issue_comment events execute the default-branch
      # definition; github.sha IS that trusted commit.
      - name: Checkout trusted policy at the definition's own SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Trusted root
        run: echo "Definition and policy trust root — default-branch SHA ${{ github.sha }}"

      # Comment-triggered redispatch is AUTHORIZED-AUTHOR ONLY: an
      # arbitrary public commenter must not be able to launch privileged
      # gate runs (and thereby paid reviewer work) merely by including
      # marker-looking text — the evaluator would ignore such text as
      # invalid evidence anyway, so there is nothing legitimate to
      # re-evaluate. Only a write+/maintain/admin comment author (real
      # contract evidence can only come from them or from suppressed
      # GITHUB_TOKEN posts) triggers a redispatch; others end here,
      # quietly and without any dispatch. Label/edit events are already
      # limited to actors with triage+ access by GitHub itself.
      - name: Authorize comment-triggered redispatch
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$REPO/collaborators/$COMMENT_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "Comment author $COMMENT_AUTHOR permission: $perm" ;;
            *)
              echo "Comment author $COMMENT_AUTHOR (permission: $perm) is not an authorized evidence source — the marker-looking text is data for the evaluator, not a trigger; no privileged dispatch."
              echo "SKIP=true" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Re-run the gates on every open PR closing this issue
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          if [ ! -f scripts/agents/evaluator.mjs ]; then
            echo "Policy scripts not on main yet — nothing to dispatch."; exit 0
          fi
          # Exhaustive pagination — a linked PR beyond page 1 is never
          # silently missed; an unprovably complete listing fails.
          node scripts/agents/find-linked-prs.mjs --repo "$REPO" --issue "$ISSUE" > /tmp/linked-prs.txt
          if [ ! -s /tmp/linked-prs.txt ]; then
            echo "No open PR closes #$ISSUE — nothing to re-run."
            exit 0
          fi
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "Issue #$ISSUE changed — re-dispatching the privileged gates for PR #$pr at its current HEAD."
            # Plain reevaluation only: valid same-state evidence is
            # reused; force is authenticated HUMAN intent, never a
            # watcher side effect.
            gh workflow run agent-gates.yml --repo "$REPO" --ref main -f pr="$pr" -f force_review=false
          done < /tmp/linked-prs.txt
