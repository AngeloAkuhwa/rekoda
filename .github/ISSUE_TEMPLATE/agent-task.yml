name: Agent task
description: An implementation-ready unit of work for the autonomous engineering loop (see docs/AUTONOMOUS-ENGINEERING.md).
labels: [agent-task]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The observable end state when this is done — behaviour, not activity.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: Why this belongs in the launch path (or why it is explicitly backlog).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Proof the work is real and not already done — file paths at HEAD, failing test output, doc citations. Repository evidence outranks model memory.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Required context
      description: The exact docs, ADRs and source paths the implementer must read first. Use docs/agents/CONTEXT-MAP.md to pick them.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The smallest complete vertical slice.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What is explicitly excluded, so the implementer does not drift into it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable criteria — each one either holds at HEAD or it does not.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
      description: Which suites must pass and which new tests must exist (regression test for any defect).
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Per AGENTS.md §4. When unsure between two levels, pick the higher. R3 requires an owner decision before implementation.
      options:
        - R0 — docs/copy/non-behavioural
        - R1 — ordinary isolated behaviour
        - R2 — schema/integrations/jobs/cross-module
        - R3 — owner decision required
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, PRs, or owner-held items (docs/REKODA_OWNER_DECISIONS.md §2) that must land first. "None" if none.
    validations:
      required: true
  - type: dropdown
    id: decision-status
    attributes:
      label: Decision status
      description: READY means an implementer could start with no unanswered decision. Anything R3, and anything with a real open question, is NEEDS-OWNER-DECISION.
      options:
        - READY
        - NEEDS-OWNER-DECISION
    validations:
      required: true
  - type: textarea
    id: owner-question
    attributes:
      label: Owner question (if NEEDS-OWNER-DECISION)
      description: The exact question the owner must answer, the options, and the planner's recommendation.
